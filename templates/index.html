<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>BOSS MUDDY</title>
<style>body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:15px}.card{background:#111;border:2px solid #00ff88;border-radius:20px;padding:20px}input{width:90%;padding:12px;margin:8px;border-radius:10px;border:none}.btn{background:#00ff88;color:#000;padding:14px;width:100%;border:none;border-radius:10px;font-weight:bold;margin-top:10px}</style></head>
<body><h2>🔥 BOSS MUDDY WIFI 🔥</h2>
<div class="card"><p>MAC Yako: <b id="mac">{{mac}}</b></p>
<input id="jina" placeholder="Jina lako"><input id="namba" placeholder="Namba ya TigoPesa 07..."><button class="btn" onclick="jisajili()">LIPA 1000 SIKU 1</button><p id="status"></p></div>
<script>
const MAC = document.getElementById('mac').innerText;
function jisajili(){
 let jina=document.getElementById('jina').value; let namba=document.getElementById('namba').value;
 if(!jina||!namba){alert('Jaza jina na namba');return;}
 document.getElementById('status').innerText='Inatuma PUSH...';
 fetch('/api/jisajili',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jina:jina,namba:namba,mac:MAC})})
 .then(r=>r.json()).then(d=>{
   document.getElementById('status').innerText='PUSH imetumwa! Lipa kisha utaunganishwa';
   // Baada ya kulipa, tunaita hii
   setTimeout(()=>thibitisha(d.password), 5000);
 });
}
function thibitisha(pass){
 fetch('/api/thibitisha-malipo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mac:MAC,plan:'1day',password:pass})})
 .then(r=>r.json()).then(d=>{document.getElementById('status').innerText='✅ UMELIPA! Internet inawaka sasa';});
}
</script></body></html>
